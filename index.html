<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twie Crochet</title>

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>
/* ================= ROOT ================= */
:root{
  --bg-main:#fff7fb;
  --bg-card:#ffffff;
  --primary:#ff6fae;
  --secondary:#7c8cff;
  --accent:#ffd166;
  --text:#333;
  --border:rgba(0,0,0,.08);
  --radius:18px;
  --shadow:0 12px 30px rgba(0,0,0,.12);
}

/* RESET */
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:linear-gradient(120deg,#fff1f6,#f5f7ff);
  color:var(--text);
}

/* ================= HEADER ================= */
.header-frame{
  padding:20px;
  text-align:center;
}
.header-frame h1{
  font-family:Caveat,cursive;
  font-size:42px;
  color:var(--primary);
}

/* ================= NAV ================= */
.nav-frame{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
}
.nav-links{
  display:flex;
  gap:16px;
}
.nav-links a{
  text-decoration:none;
  padding:8px 14px;
  border-radius:999px;
  font-weight:600;
  color:var(--text);
}
.nav-links a:hover{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
}

/* hamburger */
.menu-btn{
  display:none;
  font-size:26px;
  cursor:pointer;
}

/* ================= SLIDER ================= */
.slider-frame{
  max-width:1200px;
  margin:30px auto;
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.slides{
  display:flex;
  transition:.5s;
}
.slide img{
  width:100%;
  display:block;
}

/* ================= SECTION ================= */
section{
  max-width:1200px;
  margin:40px auto;
  padding:0 16px;
}
section h2{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:24px;
  margin-bottom:20px;
}

/* ================= CARD ================= */
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.product{
  background:var(--bg-card);
  border:2px solid transparent;
  border-radius:var(--radius);
  padding:16px;
  box-shadow:var(--shadow);
  transition:.3s;
}
.product:hover{
  transform:translateY(-6px) scale(1.02);
  border-color:var(--primary);
}
.product img{
  width:100%;
  border-radius:14px;
}
.product h2{
  font-size:16px;
  margin:10px 0 4px;
}
.price{
  font-weight:700;
  color:var(--primary);
}
.product button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
}

/* ================= BANNER ================= */
.promo-banner{
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#fff;
  text-align:center;
  padding:30px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.promo-banner button{
  margin-top:12px;
  padding:10px 20px;
  border:none;
  border-radius:999px;
  background:#fff;
  font-weight:700;
  cursor:pointer;
}

/* ================= FOOTER ================= */
footer{
  margin-top:60px;
  padding:30px 16px;
  text-align:center;
  background:#fff;
  border-top:1px solid var(--border);
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .nav-links{
    position:fixed;
    inset:60px 0 auto 0;
    background:#fff;
    flex-direction:column;
    padding:20px;
    display:none;
  }
  .nav-links.show{display:flex}
  .menu-btn{display:block}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header-frame">
  <h1>Twie Crochet 🧶</h1>
</div>

<!-- NAV -->
<div class="nav-frame">
  <div class="nav-inner">
    <strong>Twie</strong>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>
    <div class="nav-links" id="nav">
      <a href="#">Trang chủ</a>
      <a href="#products">Sản phẩm</a>
      <a href="#footer">Liên hệ</a>
    </div>
  </div>
</div>

<!-- SLIDER -->
<div class="slider-frame">
  <div class="slides" id="slides">
    <div class="slide"><img src="./assets/anh/anhslider/slider.jpeg"></div>
    <div class="slide"><img src="./assets/anh/anhslider/slider.jpeg"></div>
  </div>
</div>

<!-- BANNER -->
<section class="promo-banner">
  <h2>Khuyến mãi Tết ✨</h2>
  <p>Mua 3 tặng 1 cho toàn bộ móc khóa len</p>
  <button>Xem ngay</button>
</section>

<!-- PRODUCTS -->
<section id="products">
<h2>Sản phẩm nổi bật</h2>
<div class="products">
  <div class="product">
    <img src="./assets/anh/anhsanpham/mkbegacatim.jpg">
    <h2>Móc Khóa Bé Gà</h2>
    <div class="price">50.000đ</div>
    <button>Thêm giỏ</button>
  </div>
  <div class="product">
    <img src="./assets/anh/anhsanpham/mkbeheocasau.jpg">
    <h2>Móc Khóa Heo Cá Sấu</h2>
    <div class="price">60.000đ</div>
    <button>Thêm giỏ</button>
  </div>
</div>
</section>

<!-- FOOTER -->
<footer id="footer">
  <p>© 2025 Twie Crochet</p>
</footer>

<script>
function toggleMenu(){
  document.getElementById("nav").classList.toggle("show")
}
</script>

</body>
</html>
